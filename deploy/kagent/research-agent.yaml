# research-agent as a kagent bring-your-own agent (research-agent D-032, spec 025).
#
# The image implements kagent's A2A gRPC contract. It holds no credential:
#   - Bedrock: the AgentTemplate's ModelConfig makes bedrock-runtime an allowed
#     destination, and the egress gateway replaces the placeholder bearer token
#     with the key from Secret kagent-bedrock.
#   - Search and pages: every outbound call goes to the research-tools service
#     (namespace agents), which holds the search keys (research-agent D-034).
# IMAGE: set by scripts/release.sh to the digest pushed to ECR (Harness requires a digest).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: research-agent
  namespace: kagent
spec:
  byo: {}
  workload:
    image: 288417637285.dkr.ecr.us-west-2.amazonaws.com/research-agent@sha256:8bc89efdd28c5b9e2fae0714d57ce0b39de1f599e4695e48e0494f31cef47262
    command: ["/app/.venv/bin/research-agent-a2a"]
  env:
    # Python gRPC's default c-ares resolver doesn't reach the sandbox's DNS relay;
    # use getaddrinfo like kagent's Go runtime (spec 025).
    - name: GRPC_DNS_RESOLVER
      value: native
    - name: GRPC_VERBOSITY
      value: INFO
    - name: GRPC_TRACE
      value: client_channel,subchannel,http_proxy_mapper
    - name: RESEARCH_AGENT_PROVIDER
      value: bedrock
    - name: AWS_REGION
      value: us-west-2
    - name: AWS_BEARER_TOKEN_BEDROCK
      value: kagent-credential-injected
    - name: RESEARCH_AGENT_TOOLS_URL
      value: http://research-tools.agents.svc.cluster.local:8080
    # Must match a key research-tools holds (kv/projects/research-agent/search).
    - name: RESEARCH_AGENT_SEARCH_PROVIDER
      value: brave
    # "on" only when ADS_API_TOKEN is in that secret.
    - name: RESEARCH_AGENT_ADS_REMOTE
      value: "off"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://openbao-nonprod-agent-snapshots-288417637285/kagent/research-agent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: research-agent
  namespace: kagent
spec:
  description: >-
    Researches a question on the web and in PubMed, arXiv, NASA ADS and Semantic
    Scholar, and answers with a Markdown report in which every claim links to a
    page it read. Takes 1-3 minutes.
  modelConfig:
    name: default-model-config
---
# The research-tools service is in another namespace: grant it explicitly.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: research-tools
  namespace: kagent
spec:
  destinations:
    - origin: http://research-tools.agents.svc.cluster.local:8080
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: research-agent
  namespace: kagent
spec:
  harnessRef:
    name: research-agent
  template:
    ref:
      name: research-agent
  egressPolicyRefs:
    - name: research-tools
