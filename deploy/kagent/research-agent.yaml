# research-agent as a kagent bring-your-own agent (research-agent D-032, spec 025).
#
# The image implements kagent's A2A gRPC contract. It holds no credential:
#   - Bedrock: the AgentTemplate's ModelConfig makes bedrock-runtime an allowed
#     destination, and the egress gateway replaces the placeholder bearer token
#     with the key from Secret kagent-bedrock.
#   - Search and pages: every outbound call goes to the research-tools service
#     (namespace agents), which holds the search keys (research-agent D-034).
# IMAGE: set by scripts/release.sh to the digest pushed to ECR (Harness requires a digest).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: research-agent
  namespace: kagent
spec:
  byo: {}
  workload:
    image: 288417637285.dkr.ecr.us-west-2.amazonaws.com/research-agent@sha256:397e413461bff8a13399683da2f9808947133072a51686fb5565de2b4d38926c
    command: ["/app/.venv/bin/research-agent-a2a"]
  env:
    - name: RESEARCH_AGENT_PROVIDER
      value: bedrock
    - name: AWS_REGION
      value: us-west-2
    # Claude Opus 4.6 until Bedrock serves Opus 5.5 to this account (research-agent
    # D-035); Opus 4.8 isn't available either, so no client-side refusal fallback.
    - name: RESEARCH_AGENT_MODEL
      value: us.anthropic.claude-opus-4-6-v1
    - name: RESEARCH_AGENT_BEDROCK_FALLBACK
      value: none
    - name: AWS_BEARER_TOKEN_BEDROCK
      value: kagent-credential-injected
    - name: RESEARCH_AGENT_TOOLS_URL
      value: http://research-tools.agents.svc.cluster.local:8080
    # Must match keys research-tools holds (kv/projects/research-agent/search).
    - name: RESEARCH_AGENT_SEARCH_PROVIDER
      value: exa
    - name: RESEARCH_AGENT_SEARCH_FALLBACK
      value: brave
    # "on" only when ADS_API_TOKEN is in that secret.
    - name: RESEARCH_AGENT_ADS_REMOTE
      value: "on"
    # Reports and the run's JSONL trace go to the reports service after each run, and the
    # reply links the report (research-agent spec 026; spec 027 REQ-02/06). The service
    # also gives the keyed user hash for spans.
    - name: RESEARCH_AGENT_REPORTS_URL
      value: http://research-reports.agents.svc.cluster.local:8080
    # Traces with full content to the Collector, then Phoenix (HD-004, D-036).
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
    - name: RESEARCH_AGENT_TRACE_CONTENT
      value: "on"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://openbao-nonprod-agent-snapshots-288417637285/kagent/research-agent/
---
# For a bring-your-own image kagent allows the ModelConfig's host but attaches no
# credential (found 2026-11-16), so grant it explicitly: the gateway replaces the
# placeholder bearer token with the Bedrock API key. The key never enters the sandbox.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: bedrock
  namespace: kagent
spec:
  destinations:
    - origin: https://bedrock-runtime.us-west-2.amazonaws.com
      authentication:
        header: Authorization
        prefix: "Bearer "
        secretKeyRef:
          name: kagent-bedrock
          key: AWS_BEARER_TOKEN_BEDROCK
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: otel-collector
  namespace: kagent
spec:
  destinations:
    - origin: http://otel-collector.observability.svc.cluster.local:4318
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: research-agent
  namespace: kagent
spec:
  description: >-
    Researches a question on the web and in PubMed, arXiv, NASA ADS and Semantic
    Scholar, and answers with a Markdown report in which every claim links to a
    page it read. Takes 1-3 minutes.
  modelConfig:
    name: default-model-config
---
# The research-tools service is in another namespace: grant it explicitly.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: research-tools
  namespace: kagent
spec:
  destinations:
    - origin: http://research-tools.agents.svc.cluster.local:8080
---
# The reports service's write port, in namespace agents (spec 026). Its download port is
# not granted: the agent never reads reports.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: research-reports
  namespace: kagent
spec:
  destinations:
    - origin: http://research-reports.agents.svc.cluster.local:8080
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: research-agent
  namespace: kagent
spec:
  harnessRef:
    name: research-agent
  template:
    ref:
      name: research-agent
  egressPolicyRefs:
    - name: research-tools
    - name: bedrock
    - name: otel-collector
    - name: research-reports
