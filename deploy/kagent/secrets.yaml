# Secrets for agents in the kagent namespace, synced by ESO from OpenBao (HD-003).
# The `eso-agents` role (openbao-platform layer 50) may read only
# kv/projects/ai-hub/* and kv/projects/research-agent/*. The CA ConfigMap
# `openbao-ca` is published here by openbao-platform layer 45.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-agents
  namespace: kagent
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-agents
  namespace: kagent
spec:
  provider:
    openBao:
      server: https://openbao-active.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          path: kubernetes
          role: eso-agents
          serviceAccountRef:
            name: eso-agents
---
# Bedrock API key (openbao-platform layer 45 creates it, layer 50 stores it).
# Used by kagent's default ModelConfig and injected by the egress gateway into
# research-agent's Bedrock requests; never mounted into an agent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-bedrock
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao-agents
  target:
    name: kagent-bedrock
    creationPolicy: Owner
  data:
    - secretKey: AWS_BEARER_TOKEN_BEDROCK
      remoteRef:
        key: projects/ai-hub/bedrock
        property: AWS_BEARER_TOKEN_BEDROCK
